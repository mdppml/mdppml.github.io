<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta name="google-site-verification" content="6EAVFO15TI_11NcauwunQoju4uUaK4ATInxRx4SZwus" />
  <meta name="theme-color" content="#ffffff">
  <link rel="preload" href="{{ site.baseurl }}/fonts/source-sans-3-regular.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="{{ site.baseurl }}/fonts/source-serif-4-display-semibold.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl | prepend: site.url }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="icon" type="image/x-icon" href="{{ site.url }}{{ site.baseurl }}/images/logopic/LOGO_mdppml.ico">
  <script>document.documentElement.className += ' js';</script>
</head>
