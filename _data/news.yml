- date: 01 October 2024
  headline: "Second place in the Junior Research Group Competition at MII"
  detail: "With our research work, [*Privacy-Preserving Federated Unsupervised Domain Adaptation with Application to Age Prediction from DNA Methylation Data*](https://www.miracum.org/das-konsortium/events/miracum-difuture-symposium-2024/), we were awarded second place in the Junior Research Group Competition at MII."

- date: 30 August 2024
  headline: "Our paper is accepted to IEEE Healthcom 2024"
  detail: "We are happy to share that our paper [*Privacy Preserving Data Imputation via Multi-party Computation for Medical Applications*](https://healthcom2024.ieee-healthcom.org/) is accepted to IEEE Healthcom 2024."

- date: 26 July 2024
  headline: "A DPM 2024 publication!"
  detail: "We are happy to share that our paper [*Dynamic k-anonymity: A Topological Framework*](https://deic.uab.cat/dpm/dpm2024/cfp.html) is accepted to Data Privacy Management 2024."

- date: 19 July 2024
  headline: "A Cell Patterns publication!"
  detail: "We are happy to share that our paper [*A privacy-preserving approach for cloud-based protein fold recognition*](https://www.cell.com/patterns/fulltext/S2666-3899(24)00156-9) is accepted to Cell Patterns."

- date: 05 July 2024
  headline: "A CIBB 2024 acceptance!"
  detail: "We are happy to share that our paper [*Privacy-preserving Distributed Kernel Learning for Medical Image Analysis*](https://arxiv.org/abs/2306.02677) is accepted to CIBB 2024."

- date: 11 September 2023
  headline: "An IEEE TPS 2023 publication!"
  detail: "We are happy to share that our paper [*A Privacy-Preserving Framework for Collaborative Machine Learning with Kernel methods*](https://arxiv.org/abs/2306.02677) is accepted to IEEE Conference on Trust, Privacy and Security 2023."

- date: 06 May 2023
  headline: "An NSS-SocialSec 2023 publication!"
  detail: "We are happy to share that our paper [*ppAURORA: Privacy Preserving Area Under Receiver Operating Characteristic and Precision-Recall Curves*](https://nss2023.cyber.kent.ac.uk/papers.php) is accepted to NSS-SocialSec 2023."

