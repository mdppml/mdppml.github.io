- title: "Identifying disease-causing mutations with privacy protection"
  image: idengen.png
  description: We present an approach to identify disease-associated variants and genes while ensuring patient privacy. The proposed method uses secure multi-party computation to find disease-causing mutations under specific inheritance models without sacrificing the privacy of individuals. It discloses only variants or genes obtained as a result of the analysis. Thus, the vast majority of patient data can be kept private.
  authors: M Akgün, AB Ünal, B Ergüner, N Pfeifer, O Kohlbacher
  link:
    url: https://doi.org/10.1093/bioinformatics/btaa641
    display: Bioinformatics 36,21 (2021)
  highlight: 1

- title: "A Privacy-Preserving Federated Learning Approach for Kernel methods"
  image: anika_fedker.png
  description: It is challenging to implement Kernel methods, if the data sources are distributed and cannot be joined at a trusted third party for privacy reasons. It is even more challenging, if the use case rules out privacy-preserving approaches that introduce noise. An example for such a use case is machine learning on clinical data. To realize exact privacy preserving computation of kernel methods, we propose FLAKE, a Federated Learning Approach for KErnel methods on horizontally distributed data. With FLAKE, the data sources mask their data so that a centralized instance can compute a Gram matrix without compromising privacy. The Gram matrix allows to calculate many kernel matrices, which can be used to train kernel-based machine learning algorithms such as Support Vector Machines. We prove that FLAKE prevents an adversary from learning the input data or the number of input features under a semi-honest threat model. Experiments on clinical and synthetic data confirm that FLAKE is outperforming the accuracy and efficiency of comparable methods. The time needed to mask the data and to compute the Gram matrix is several orders of magnitude less than the time a Support Vector Machine needs to be trained. Thus, FLAKE can be applied to many use cases.
  authors: A Hannemann, AB Ünal, A Swaminathan, E Buchmann, M Akgün
  link:
    url: https://arxiv.org/abs/2306.02677
    display: arxiv:2306.02677 (2023)
  highlight: 1
  
