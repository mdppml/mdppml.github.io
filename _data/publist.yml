- title: "Empirical Evidence for Simply Connected Decision Regions in Image Classifiers"
  image: simply.png
  description: >
    Understanding the topology of decision regions is central to explaining the inner workings of deep neural networks. 
    Prior empirical work has provided evidence that these regions are path connected. 
    We study a stronger topological question: whether closed loops inside a decision region can be contracted without leaving that region. 
    To this end, we propose an iterative quad-mesh filling procedure that constructs 
    a finite-resolution label-preserving surface bounded by a given loop and lying entirely within the same decision region. 
  authors: A Swaminathan, M Akgün
  venue: "arXiv preprint"
  year: 2026
  themes: [ai-security]
  links:
