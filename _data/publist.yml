- title: "Unsupervised Multi-Source Federated Domain Adaptation under Domain Diversity through Group-Wise Discrepancy Minimization"
  image: gala.png
  description: >
    We propose **GALA**, a scalable and robust federated UMDA framework that introduces two key components:
    (1) an inter-group discrepancy minimization objective that approximates full pair-wise domain alignment
    without quadratic computation; and
    (2) a temperature-controlled, centroid-based weighting strategy that dynamically prioritizes source domains
    based on alignment with the target. To evaluate high-diversity scenarios, we introduce Digit-18,
    a benchmark of 18 digit datasets with varied synthetic and real-world domain shifts. Extensive experiments
    show that GALA matches or exceeds state-of-the-art performance on standard benchmarks and decisively outperforms
    prior methods in diverse multi-source settings where others fail to converge.
  authors: L Reichart, CA Baykara, AB Ünal, H Lee, M Akgün
  venue: "ICML"
